services:
  verdestats:
    build: .
    image: verdestats:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:30008:8080"
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
